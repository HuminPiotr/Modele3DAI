
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Aplikacji Głosowej z Hugging Face TTS</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f4f4f4; color: #333; }
        .container { background-color: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); max-width: 700px; margin: auto; }
        h2, h3 { color: #0056b3; }
        textarea { width: 98%; min-height: 70px; padding: 10px; border-radius: 4px; border: 1px solid #ccc; margin-bottom: 10px; font-size: 1em; }
        input[type="text"], input[type="password"], input[type="number"], select { width: 98%; padding: 10px; border-radius: 4px; border: 1px solid #ccc; margin-bottom: 10px; font-size: 1em; box-sizing: border-box; }
        input[type="checkbox"] { margin-right: 5px; vertical-align: middle;}
        button { background-color: #007bff; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-size: 1em; margin: 5px 0; }
        button:hover { background-color: #0056b3; }
        button:disabled { background-color: #ccc; }
        .info { font-size: 0.9em; color: #666; margin-top: 5px; margin-bottom:15px; padding: 8px; background-color: #e9ecef; border-left: 3px solid #007bff; }
        .warning { font-size: 0.9em; color: #721c24; background-color: #f8d7da; border: 1px solid #f5c6cb; padding: 10px; border-radius: 4px; margin-bottom: 15px; }
        .status-box { padding: 10px; margin-bottom:10px; border-radius:4px; }
        .status-listening { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .status-processing { background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
        .status-idle { background-color: #e2e3e5; color: #383d41; border: 1px solid #d6d8db; }
        .error-message { color: red; font-weight: bold; }
        .sample-buttons button { background-color: #28a745; margin-right: 10px; }
        .sample-buttons button:hover { background-color: #1e7e34; }
        audio { margin-top: 10px; width: 100%; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
    </style>
</head>
<body>
